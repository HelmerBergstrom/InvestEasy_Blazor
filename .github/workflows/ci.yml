name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InvestEasy.sln

      - name: Build
        run: dotnet build InvestEasy.sln --no-restore -c Release

      - name: Test
        run: dotnet test InvestEasy.sln --no-build -c Release
